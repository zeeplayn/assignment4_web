<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 1 - HTML5 Validation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Contact Form (with validation)</h1>

  <form action="#" method="post">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required minlength="2" maxlength="30"><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="5" cols="30" required minlength="10" maxlength="200"></textarea><br><br>

    <button type="submit">Send</button>
  </form>
</body>
</html>
