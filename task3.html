<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 3 - Bootstrap Validation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Contact Us (validation)</h1>

    <form id="contactForm" novalidate>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" placeholder="Your name" required minlength="2">
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Name is required (min 2 letters).</div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Email is required and must be correct.</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="4" required minlength="10"></textarea>
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Message is required (min 10 characters).</div>
      </div>

      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </div>

  <script>
    var form = document.getElementById("contactForm");
    var inputs = form.querySelectorAll("input, textarea");

    // check one field and add is-valid or is-invalid
    function checkField(field) {
      if (field.checkValidity()) {
        field.classList.add("is-valid");
        field.classList.remove("is-invalid");
      } else {
        field.classList.add("is-invalid");
        field.classList.remove("is-valid");
      }
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      for (var i = 0; i < inputs.length; i++) {
        checkField(inputs[i]);
      }
      if (form.checkValidity()) {
        alert("Form sent!");
      }
    });

    // check while typing
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].addEventListener("input", function () {
        checkField(this);
      });
    }
  </script>
</body>
</html>
